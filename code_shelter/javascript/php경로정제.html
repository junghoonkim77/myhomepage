<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    input {
        width : 300px;
        margin-bottom: 5px;
    }
    .div1, .div2, .div3, .div4, .div5, .div6, .div7 {
        cursor : pointer;
        padding: 5px 0;
        color: #333;
    }
    .div7 {
        color: #0056b3; 
        font-weight: bold;
    }
    hr {
        margin: 20px 0;
        border: 0;
        border-top: 1px solid #ccc;
    }
</style>    
<script src="https://code.jquery.com/jquery-3.6.4.js" integrity="sha256-a9jBBRygX1Bh5lt8GZjXDzyOB+bWve9EiO7tROUtj/E=" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/ui/1.13.1/jquery-ui.js" integrity="sha256-6XMVI0zB8cRzfZjqKcD01PBsAy3FlDASrlC8SxCpInY=" crossorigin="anonymous"></script> 
<script src="../../java/library.js"></script>
    <title>php경로조작 (Cafe24 추가)</title>
</head>
<body>
    <input type="text" placeholder="경로를 넣으세요" name="" id="firstinput">
    <div class="div1 clicked"></div>
    <div class="div2 clicked"></div>
    <div class="div3 clicked"></div>
    
    <hr>

    <input type="text" placeholder="닷홈 경로" name="" id="secondinput">
    <div class="div4 clicked"></div>
    <div class="div5 clicked"></div>
    <div class="div6 clicked"></div>

    <hr>

    <input type="text" placeholder="Cafe24 프로젝트 경로" name="" id="thirdinput">
    <div class="div7 clicked"></div>

    <script>
        // 1. 첫번째 로직
        $('#firstinput').on('keyup',function(){
            $val = $(this).val();
            $chval = $val.replaceAll("\\","/");
            $gitresul1 = $chval.replace(/github/i,'#');
            $gitresul_idx = $gitresul1.indexOf('#')+1
            $gitresul_mid = $gitresul1.slice($gitresul_idx);
            $gitresul_fin = "https://junghoonkim77.github.io"+$gitresul_mid;
            
            $result = $chval.replaceAll("htdocs","localhost")
            $result1 = $result.replace('che2/','★');
            $staridx = $result1.indexOf('★')+1
            $result2 = $result1.slice($staridx);
            $result3 = $result2.replace(/localhost\/github\/myhomepage/i,'http://folkball.dothome.co.kr/mypagere');
            
            $('.div1').text($result2);
            $('.div2').text($result3);
            $('.div3').text($gitresul_fin);
        });

        // 2. 레노버 노트북 로직
        $('#secondinput').on('keyup',function(){
            $val = $(this).val();
            $chval = $val.replaceAll("\\","/");
            $gitresul1 = $chval.replace("htdocs/myhomepage","#");
            $gitresul_idx = $gitresul1.indexOf('#')+1
            $gitresul_mid = $gitresul1.slice($gitresul_idx);
            $gitresul_fin = "https://junghoonkim77.github.io"+$gitresul_mid;
            
            $result = $chval.replaceAll("htdocs","localhost")
            $result1 = $result.replace('localhost/','★');
            $staridx = $result1.indexOf('★')+1
            $result2 ="localhost/"+ $result1.slice($staridx);
            $result3 ='http://folkball.dothome.co.kr/mypagere/'+$result1.slice($staridx);
            $result4 = $result3.replace("myhomepage/","");
            
            $result3=$result2.replace('localhost/','http://folkball.dothome.co.kr/mypagere');
            $('.div4').text($result2);
            $('.div5').text($result4);
            $('.div6').text($gitresul_fin);
        });

        // 3. Cafe24 전용 로직 (수정됨)
        $('#thirdinput').on('keyup',function(){
            let $val = $(this).val();
            let $chval = $val.replaceAll("\\","/");
            
            let $baseFolder = "htdocs/"; 
            let $finalUrl = "";

            if ($chval.includes($baseFolder)) {
                let $idx = $chval.indexOf($baseFolder) + $baseFolder.length;
                let $mid = $chval.slice($idx);
                $finalUrl = "https://folkball.mycafe24.com/" + $mid;
            } else {
                let $lastIdx = $chval.lastIndexOf("/") + 1;
                let $fileName = $chval.slice($lastIdx);
                $finalUrl = "https://folkball.mycafe24.com/" + $fileName;
            }

            // ★ 추가된 부분: URL에 'myhomepage/'가 포함되어 있다면 빈 문자열("")로 교체하여 삭제합니다.
            $finalUrl = $finalUrl.replace("myhomepage/", "");

            $('.div7').text($finalUrl);
        });

        // 클릭 시 복사
        $('.clicked').click(function(){
            if(typeof $lib !== 'undefined' && $lib.clipcopy) {
                $lib.clipcopy($(this).text());
            } else {
                navigator.clipboard.writeText($(this).text()).then(function() {
                    console.log("복사 완료!");
                });
            }
        });
    </script>
</body>
</html>
