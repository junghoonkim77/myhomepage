<script>
    $(document).ready(function(){
        // 1. 저장된 이름 불러오기
        var savedName = localStorage.getItem('SaleIpName');
        if(savedName) {
            $('.name-select').val(savedName);
        }

        // 2. 이름 선택 시 양쪽 폼 모두 자동 변경 및 저장
        $('.name-select').on('change', function(){
            var selectedName = $(this).val();
            $('.name-select').val(selectedName); 
            localStorage.setItem('SaleIpName', selectedName); 
        });

        // 3. 폼 제출 시 이름 선택 여부 검사
        $('#todayinsert, #todayinsertDiff').on('submit', function(e){
            // 현재 제출되는 폼 안의 select 값을 확인
            if($(this).find('.name-select').val() === "") {
                alert('본인 이름을 먼저 선택해주세요!');
                e.preventDefault(); 
            }
        });
        
        // 4. 현재 '월' 표시
        $('.nowmonth').text(new Date().getMonth() + 1);
    });
</script>
