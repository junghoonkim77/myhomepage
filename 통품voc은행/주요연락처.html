<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        
        <link href="../css/tabcontent.css" rel="stylesheet" type="text/css" />
        <script src="https://code.jquery.com/jquery-3.6.4.js" integrity="sha256-a9jBBRygX1Bh5lt8GZjXDzyOB+bWve9EiO7tROUtj/E=" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.js" integrity="sha256-6XMVI0zB8cRzfZjqKcD01PBsAy3FlDASrlC8SxCpInY=" crossorigin="anonymous"></script> 
        <script src="../java/tabcontent.js" type="text/javascript"></script>
        <script src="../java/library.js"></script>
        <script>
            $( function() {
              $( "#tabs" ).tabs();
            } );
        </script>
        <style>
            /* --- 전체 레이아웃 (이전 요건: 전체 2/3 폭) --- */
            body {
                display: flex;
                justify-content: center;
                margin: 0;
                padding: 10px;
                background-color: #f9f9f9;
            }
            #tabs {
                width: 66.66%; 
                min-width: 400px;
                background-color: #fff;
            }
            
            /* --- 🚀 이번에 추가된 부분: 탭(li) 디자인 및 폭 축소 --- */
            #tabs ul.tabs {
                display: flex; /* 탭들을 가로로 고르게 배치 */
                padding: 0;
                margin: 0;
            }
            #tabs ul.tabs li {
                flex: 1; /* 4개의 탭이 가로 폭을 동일한 비율로 1/4씩 나눠 가짐 */
                text-align: center;
                min-width: 0; /* flex 환경에서 텍스트가 넘칠 때 축소 허용 */
            }
            #tabs ul.tabs li a {
                display: block;
                padding: 8px 5px !important; /* jQuery UI의 기본 넓은 패딩을 강제로 좁힘 */
                font-size: 11px !important; /* 글자 크기 축소 */
                letter-spacing: -0.5px; /* 글자 간격 약간 좁힘 */
                white-space: nowrap; /* 글자가 아래로 줄바꿈 되는 것 방지 */
                overflow: hidden; 
                text-overflow: ellipsis; /* 글자가 폭보다 길면 '...'으로 깔끔하게 처리 */
                box-sizing: border-box;
                width: 100%;
            }
            /* -------------------------------------------------------- */

            .tabcontents iframe {
                width: 100%;
                height: 500px; 
                border: none;
            }
            #password {
                width: 100%;
                box-sizing: border-box;
                padding: 8px;
                margin-bottom: 10px;
            }

            /* 테이블 디자인 */
            #tabs-4 table {
                display : none;
                width: 100%;
                border-collapse: collapse;
            }
            table { border:1px solid gray; }
            th { border:1px solid gray; padding: 5px; background-color: #eee; font-size: 13px; }
            td { border:1px solid gray ; cursor:pointer; padding: 5px; font-size: 13px; text-align: center; }
            td:hover {
                color : blue;
            }
        </style>
    </head>
<body>

<div id="tabs">
    <ul class="tabs" data-persist="true">
        <li><a href="#tabs-1"> HLR /교환실 /통품업무연락처      </a></li>
        <li><a href="#tabs-2"> Feature Code/넷윈도 필드명       </a></li>
        <li><a href="#tabs-3"> USIM이동성코드 </a></li>
        <li><a href="#tabs-4"> 팀원 정보     </a></li>
    </ul>
    
    <div style ="height:100%" class="tabcontents">
        <div id="tabs-1">
            <iframe frameborder="0" src="../html/hlr.html"></iframe>
        </div>
       
        <div id="tabs-2">
            <iframe frameborder="0" src="../html/featurecode.html"></iframe> 
        </div>
        
        <div id="tabs-3">
            <iframe frameborder="0" src="../html/usimcode.html"></iframe> 
        </div>       
       
        <div id="tabs-4">
            <input id="password" type="text" placeholder="정보열람시 비번을 입력해주세요">
            <table style="border:1px;">
                <thead id="tr">
                    <tr>
                        <th>cs사번</th><th>kos_id</th><th>입사일</th><th>이름</th><th>기수</th><th>생일</th><th>휴대폰</th><th>K톡ID</th><th>내선</th><th>IP</th>
                    </tr>
                </thead>
            </table>         
        </div>
       
       <div>
        <table id="copy_val">

        </table>
       </div>
    </div>
</div>
<script>
    
</script>
</body>
</html>
